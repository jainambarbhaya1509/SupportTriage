[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-support-triage-env"
version = "0.1.0"
description = "A real-world OpenEnv support triage environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "requests>=2.33.0",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
server = "server.app:main"
support-triage-baseline = "baseline:main"

[tool.setuptools]
include-package-data = true
packages = ["server"]
py-modules = ["baseline", "client", "graders", "groq_reply", "models", "tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
